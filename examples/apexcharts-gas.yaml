# Gas price for today and tomorrow. The gas day runs from 06:00 to 06:00.
type: custom:apexcharts-card
header:
  show: true
  title: Gasprijs (all-in)
  show_states: true
graph_span: 48h
span:
  start: day
now:
  show: true
  label: Nu
yaxis:
  # Start the scale 5 cents below the lowest price, so the cheapest bar stays visible.
  - min: "|-0.05|"
    decimals: 2
apex_config:
  tooltip:
    x:
      # Show the hour the price applies to, e.g. 16:00 - 17:00.
      formatter: |
        EVAL:function(value) {
          const time = (ms) => new Date(ms).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          return time(value) + ' - ' + time(value + 3600000);
        }
series:
  - entity: sensor.anwb_energie_gas_all_in
    name: Nu
    type: column
    unit: €/m³
    float_precision: 2
    color: "#e08a2c"
    show:
      in_header: raw
    data_generator: |
      const hours = [
        ...(entity.attributes.raw_today || []),
        ...(entity.attributes.raw_tomorrow || []),
      ];
      return hours.map((hour) => [new Date(hour.start).getTime(), hour.value]);
